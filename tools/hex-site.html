<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Hex Site Map</title>
  <link rel="icon" href="/assets/favicon.svg"></link>
  <link rel="stylesheet" href="/assets/main.css">
  <style>
    svg .rotate {
      transform-box: fill-box;
      transform-origin: center;
      transform: rotate(90deg) scale(50%, 100%);
    }
  </style>
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body class="container">

  <header id="top">
    <a class="is-vertical-align" href="/">
      <span class="material-symbols-rounded">rocket_launch</span>
      <span>mitbit01.github.io</span>
    </a>
  </header>

  <hr>

  <main>
    <h1>Hex Site</h1>

    <div class="is-center">
      <svg xmlns="http://www.w3.org/2000/svg"
        width="70%" height="auto"
        viewBox="0 0 400 400">

        <rect width="100%" height="100%" fill="navajowhite" />

        <polygon points="275,70 125,70 50,200 125,330 275,330 350,200" fill="antiquewhite" />

        <line id="route-A0-A1" data-node="A0 A1" x1="275" y1="70" x2="350" y2="200" stroke="black" stroke-dasharray="5" />
        <line id="route-A1-A2" data-node="A1 A2" x1="350" y1="200" x2="275" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A2-A3" data-node="A2 A3" x1="125" y1="330" x2="275" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A3-A4" data-node="A3 A4" x1="50" y1="200" x2="125" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A4-A5" data-node="A4 A5" x1="125" y1="70" x2="50" y2="200" stroke="black" stroke-dasharray="5" />
        <line id="route-A5-A0" data-node="A5 A0" x1="125" y1="70" x2="275" y2="70" stroke="black" stroke-dasharray="5" />

        <line id="route-A0-A2" data-node="A0 A2" x1="275" y1="70" x2="275" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A1-A3" data-node="A1 A3" x1="350" y1="200" x2="125" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A2-A4" data-node="A2 A4" x1="50" y1="200" x2="275" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A3-A5" data-node="A3 A5" x1="125" y1="70" x2="125" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A4-A0" data-node="A4 A0" x1="275" y1="70" x2="50" y2="200" stroke="black" stroke-dasharray="5" />
        <line id="route-A5-A1" data-node="A5 A1" x1="125" y1="70" x2="350" y2="200" stroke="black" stroke-dasharray="5" />

        <line id="route-A0-A3" data-node="A0 A3" x1="275" y1="70" x2="125" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A1-A4" data-node="A1 A4" x1="50" y1="200" x2="350" y2="200" stroke="black" stroke-dasharray="5" />
        <line id="route-A2-A5" data-node="A2 A5" x1="125" y1="70" x2="275" y2="330" stroke="black" stroke-dasharray="5" />

        <line id="route-A0-A6" data-node="A0 A6" x1="275" y1="70" x2="200" y2="200" stroke="black" stroke-dasharray="5" />
        <line id="route-A1-A6" data-node="A1 A6" x1="200" y1="200" x2="350" y2="200" stroke="black" stroke-dasharray="5" />
        <line id="route-A2-A6" data-node="A2 A6" x1="200" y1="200" x2="275" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A3-A6" data-node="A3 A6" x1="200" y1="200" x2="125" y2="330" stroke="black" stroke-dasharray="5" />
        <line id="route-A4-A6" data-node="A4 A6" x1="50" y1="200" x2="200" y2="200" stroke="black" stroke-dasharray="5" />
        <line id="route-A5-A6" data-node="A5 A6" x1="125" y1="70" x2="200" y2="200" stroke="black" stroke-dasharray="5" />

        <circle id="room-A0" data-node="A0" cx="275" cy="70" r="30" stroke="black" fill="antiquewhite" />
        <circle id="room-A1" data-node="A1" cx="350" cy="200" r="30" stroke="black" fill="antiquewhite" />
        <circle id="room-A2" data-node="A2" cx="275" cy="330" r="30" stroke="black" fill="antiquewhite" />
        <circle id="room-A3" data-node="A3" cx="125" cy="330" r="30" stroke="black" fill="antiquewhite" />
        <circle id="room-A4" data-node="A4" cx="50" cy="200" r="30" stroke="black" fill="antiquewhite" />
        <circle id="room-A5" data-node="A5" cx="125" cy="70" r="30" stroke="black" fill="antiquewhite" />
        <circle id="room-A6" data-node="A6" cx="200" cy="200" r="30" stroke="black" fill="antiquewhite" />

        <text id="key-A0" data-node="A0" x="275" y="70" text-anchor="middle" dominant-baseline="middle" >A0</text>
        <text id="key-A1" data-node="A1" x="350" y="200" text-anchor="middle" dominant-baseline="middle" >A1</text>
        <text id="key-A2" data-node="A2" x="275" y="330" text-anchor="middle" dominant-baseline="middle" >A2</text>
        <text id="key-A3" data-node="A3" x="125" y="330" text-anchor="middle" dominant-baseline="middle" >A3</text>
        <text id="key-A4" data-node="A4" x="50" y="200" text-anchor="middle" dominant-baseline="middle" >A4</text>
        <text id="key-A5" data-node="A5" x="125" y="70" text-anchor="middle" dominant-baseline="middle" >A5</text>
        <text id="key-A6" data-node="A6" x="200" y="200" text-anchor="middle" dominant-baseline="middle" >A6</text>

        <polygon id="main-entrance" points="125,35 115,25 120,25 120,15 130,15 130,25 135,25" stroke="black" fill="antiquewhite" />
        <polygon id="hidden-entrance" points="125,35 115,25 120,25 120,15 130,15 130,25 135,25" stroke="black" stroke-dasharray="1" fill="antiquewhite" />

      </svg>
    </div>
  </main>

  <hr>

  <footer>
    <p class="is-center">©️ Mitchell Petit, 2021-2026, available under the MIT license.</p>
    <p class="is-center">
      <span>
        <a href="#top">Top</a>
        |
        <a href="https://github.com/MitBit01/mitbit01.github.io">Repository</a>
      </span>
    </p>
  </footer>

  <script type="module">
    import { Random } from '../libs/random.js'
    const rand = new Random()

    let nodes = ['A0','A1','A2','A3','A4','A5','A6']
    let edges = [
      "A0 A1","A1 A2","A2 A3","A3 A4","A4 A5","A5 A0",  // sides
      "A0 A2","A1 A3","A2 A4","A3 A5","A4 A0","A5 A1",  // short diags
      "A0 A3","A1 A4","A2 A5",                          // long diags
      "A0 A6","A1 A6","A2 A6","A3 A6","A4 A6","A5 A6"   // centers
    ]

    // Delete 1 node and all edges to it
    const delNode = nodes.splice(rand.index(nodes.length), 1)
    edges = edges.filter(e => e.includes(delNode))
    $(`*[data-node~="${delNode}"]`).remove()

    // Assign the entrances
    const [entNode, hidEntNode] = rand.shuffle(nodes).slice(0, 2)
    const entCircle = $(`circle[data-node~="${entNode}"]`)
    const entX = parseInt(entCircle.attr('cx')) - 125
    const entY = parseInt(entCircle.attr('cy')) - 70
    $('#main-entrance').attr('transform', `translate(${entX}, ${entY})`)

    const hidCircle = $(`circle[data-node~="${hidEntNode}"]`)
    const hidX = parseInt(hidCircle.attr('cx')) - 125
    const hidY = parseInt(hidCircle.attr('cy')) - 70
    $('#hidden-entrance').attr('transform', `translate(${hidX}, ${hidY})`)

    // Delete edges blocked by center
    if (nodes.includes("A6")) {
      edges = edges.filter(e => e != "A0 A3" && e != "A1 A4" && e != "A2 A5")
      $('#route-A0-A3, #route-A1-A4, #route-A2-A5').remove()
    }

    // Delete edges blocked by each other
    function isBlocked(e) {
      return false
    }
    let blockedEdges = edges.filter(isBlocked)
    while (blockedEdges.length > 0) {
      const delEdge = edges.splice(rand.index(edges.length), 1)
      $(`line[data-node="A${delEdge[0]} A${delEdge[0]}"]`).remove()
      blockedEdges = edges.filter(isBlocked)
    }
  </script>
</body>
</html>
