<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown</title>
  <link rel="icon" href="/assets/favicon.svg"></link>
  <link rel="stylesheet" href="/assets/main.css">
  <style>
    #output-container {
      margin: 2rem 0;
      font-size: xx-large;
    }
  </style>
</head>
<body class="container">

  <header id="top">
    <a class="is-vertical-align" href="/">
      <span class="material-symbols-rounded">rocket_launch</span>
      <span>mitbit01.github.io</span>
    </a>
  </header>

  <hr>

  <main>
    <h1>Countdown <span class="material-symbols-rounded">timer</span></h1>
    <form action="javascript:void(0);">
      <fieldset class="grouped is-vertical-align">
        <legend>Date and Time</legend>
        <input type="datetime-local" id="inp-datetime" >
        <button id="btn-copy-url" class="button primary">Copy Countdown URL</button>
      </fieldset>
    </form>
    <div id="output-container" class="is-center bd-success">
      <time datetime="">0 : 0 : 0 : 0</time>
    </div>
  </main>

  <hr>

  <footer>
    <p>©️ Mitchell Petit, 2021-2025, available under the MIT license.</p>
    <p><a href="#top">Top</a> | <a href="https://github.com/MitBit01/mitbit01.github.io">Repository</a></p>
  </footer>

  <script type="module">
    const input = document.body.querySelector('#inp-datetime')
    const button = document.body.querySelector('#btn-copy-url')
    const timeElement = document.body.querySelector('#output-container > time')

    const urlParams = new URLSearchParams(window.location.search)

    let targetDate = urlParams.has('datetime')
      ? new Date(urlParams.get('datetime'))
      : new Date()

    const year = targetDate.getFullYear()
    const month = (targetDate.getMonth()+1).toString().padStart(2, '0')
    const day = targetDate.getDate().toString().padStart(2, '0')
    const hour = targetDate.getHours()
    const minute = targetDate.getMinutes()
    input.value = `${year}-${month}-${day}T${hour}:${minute}`

    input.addEventListener('input', () => {
      targetDate = new Date(input.value)
    })

    button.addEventListener('click', () => {
      let url = new URL(window.location)
      url.searchParams.set('datetime', targetDate.toISOString())
      navigator.clipboard.writeText(url.toString())
    })

    const intervalId = setInterval(function() {
      const now = new Date().getTime();
      const target = targetDate.getTime();
      const distance = target > now
        ? target - now
        : 0;

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);

      timeElement.textContent = `${days} : ${hours} : ${minutes} : ${seconds}`
      }, 1000);
  </script>

</body>
</html>
