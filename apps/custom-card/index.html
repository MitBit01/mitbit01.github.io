<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Cards</title>
  <link rel="icon" href="/assets/favicon.svg"></link>
  <link rel="stylesheet" href="./style.css">
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <template class="fullart-land">

    <div class="card">
      <div class="layout fullart-land">
        <div class="title"></div>
        <div class="type"></div>
      </div>
    </div>

  </template>
  <template class="reminder">

    <div class="card">
      <div class="layout reminder">
        <div class="title"></div>
        <div class="text"></div>
      </div>
    </div>

  </template>
</body>
</html>
